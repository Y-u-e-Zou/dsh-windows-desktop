<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH-Windows桌面版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, "Microsoft YaHei", sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: #0b0e14; color: #e6e8ee;
}
.card {
  width: 420px; padding: 40px; border-radius: 12px;
  background: #151821; border: 1px solid #232a3a; text-align: center;
}
.logo {
  width: 76px; height: 76px; border-radius: 18px; margin-bottom: 16px;
  object-fit: cover; border: 1px solid #2c3444;
}
h1 { font-size: 22px; margin-bottom: 6px; }
.sub { color: #9aa3b2; font-size: 13px; margin-bottom: 24px; }
input {
  width: 100%; padding: 12px; font-size: 14px; color: #e6e8ee;
  background: #0e1118; border: 1px solid #2c3444; border-radius: 8px;
  outline: none; margin-bottom: 16px;
}
input:focus { border-color: #4d6bfe; }
.btn {
  width: 100%; padding: 12px; font-size: 15px; border: 0; border-radius: 8px;
  cursor: pointer; background: #4d6bfe; color: #fff; margin-bottom: 12px;
}
.btn:hover { background: #5d79ff; }
.link { color: #8fa3ff; font-size: 13px; text-decoration: none; cursor: pointer; }
.link:hover { text-decoration: underline; }
.ad { color: #9aa3b2; font-size: 12px; margin-top: 20px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/icon.png" alt="logo">
    <h1>DSH-Windows桌面版</h1>
    <p class="sub">输入 API Key 登录</p>
    <input id="key" type="password" placeholder="sk-..." autocomplete="off">
    <button class="btn" id="login">登 录</button>
    <a class="link" id="apply">申请 API（注册账户）</a>
    <p class="ad">对生命对科学感兴趣吗？请关注微信公众号【网柄菌】谢谢喵~</p>
  </div>
<script>
(function () {
  var keyInput = document.getElementById('key');
  var qs = new URLSearchParams(location.search);
  if (qs.get('key')) keyInput.value = qs.get('key');
  keyInput.focus();

  function doLogin() {
    var v = keyInput.value.trim();
    if (!v) { keyInput.focus(); return; }
    location.href = 'dsh-login://' + encodeURIComponent(v);
  }
  document.getElementById('login').onclick = doLogin;
  keyInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  document.getElementById('apply').onclick = function () {
    location.href = 'dsh-open://' + encodeURIComponent('https://platform.deepseek.com/');
  };
})();
</script>
</body>
</html>
